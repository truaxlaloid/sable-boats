plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

// Read properties into top-level variables to avoid task-scope conflicts
def mod_id = property('mod_id').toString()
def mod_name = property('mod_name').toString()
def mod_version = property('mod_version').toString()
def mod_group = property('mod_group').toString()
def minecraft_version = property('minecraft_version').toString()
def neoforge_version = property('neoforge_version').toString()
def sable_version = property('sable_version').toString()

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.10'
    }

    mods {
        register(mod_id) {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    compileOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}"
    runtimeOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : "example",
            'Specification-Version'   : "1",
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : "example",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
