plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${property('mod_version')}"
group = "${property('mod_group')}"

base {
    archivesName = "${property('mod_id')}-neoforge-${property('minecraft_version')}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = "${property('neoforge_version')}"

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.10'
    }

    mods {
        "${property('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    // Official Sable & Aeronautics maven
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    // Sable NeoForge 1.21.1 dependency
    compileOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${property('sable_version')}"
    runtimeOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${property('sable_version')}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Make sure the mixin configuration is recognized
tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'     : "${property('mod_id')}",
            'Specification-Vendor'    : "example",
            'Specification-Version'   : "1",
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : "example",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
