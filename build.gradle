plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('mod_group') ?: 'com.example.sableboats'

base {
    archivesName = "sableboats-neoforge-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.findProperty('neoforge_version') ?: '21.1.228'

    mods {
        register("sableboats") {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()

    // Sable & Aeronautics repository
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    compileOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${project.findProperty('sable_version') ?: '2.0.5'}"
    runtimeOnly "dev.ryanhcode.sable:sable-neoforge-1.21.1:${project.findProperty('sable_version') ?: '2.0.5'}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
